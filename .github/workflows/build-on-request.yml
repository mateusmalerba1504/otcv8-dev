name: Build on request
on: [workflow_dispatch]

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v2
      id: setup_msbuild

    - name: Pre-download 7zip for vcpkg (original URL is gone)
      shell: pwsh
      run: |
        $dl = Join-Path $env:RUNNER_TEMP "vcpkg-dl"
        New-Item -ItemType Directory -Force -Path $dl | Out-Null
        Invoke-WebRequest -Uri "https://web.archive.org/web/2022id_/https://www.7-zip.org/a/7z2107-extra.7z" -OutFile (Join-Path $dl "7z2107-extra.7z")
        Get-Item (Join-Path $dl "7z2107-extra.7z") | Format-List Name,Length
        "VCPKG_DOWNLOADS=$dl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v7
      with:
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg/
        vcpkgTriplet: x86-windows-static
        vcpkgGitCommitId: 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
        vcpkgArguments: >
          boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem
          luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl

    - name: Integrate vcpkg
      run: |
        ${{ runner.workspace }}/vcpkg/vcpkg integrate install

    - name: Compile otclient_gl
      timeout-minutes: 60
      run: |
        cd vc16
        MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{github.run_number}}

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: Download-binaries
        path: |
          otclient_gl.exe
        if-no-files-found: error
